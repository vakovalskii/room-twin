<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус сканов</title>
<style>
  :root { --bg: #f3f4f1; --card: #fff; --ink: #22261f; --dim: #80857b; --line: #e3e5df; --ok: #5d9a2a; --wait: #c99a12; --bad: #d4453a; --chip: #eef0ea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141613; --card: #1c1f1b; --ink: #ecede8; --dim: #8f948a; --line: #2b2f29; --ok: #9bd15a; --wait: #f0c94d; --bad: #ff6b5a; --chip: #252923; }
  }
  :root[data-theme="dark"] { --bg: #141613; --card: #1c1f1b; --ink: #ecede8; --dim: #8f948a; --line: #2b2f29; --ok: #9bd15a; --wait: #f0c94d; --bad: #ff6b5a; --chip: #252923; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .lead { color: var(--dim); margin: 4px 0 20px; }
  .lead code { background: var(--chip); padding: 1px 6px; border-radius: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .head h2 { margin: 0; font-size: 18px; }
  .dim { color: var(--dim); }
  .pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: 99px; background: var(--chip); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .live .dot.on { background: var(--ok); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; margin-top: 14px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; align-content: start; }
  .fr { position: relative; border-radius: 10px; overflow: hidden; border: 3px solid var(--line); background: var(--chip); aspect-ratio: 9 / 16; }
  .fr img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fr.ok { border-color: var(--ok); } .fr.queued, .fr.sent { border-color: var(--wait); } .fr.bad { border-color: var(--bad); }
  .fr.bad img { opacity: .55; }
  .fr .n { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 0 5px; border-radius: 5px; }
  .fr .r { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.72); color: #fff; font-size: 10.5px; line-height: 1.25; padding: 3px 5px; }
  .fr.bad .r { background: rgba(160, 30, 20, .85); }
  .side img { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #fafaf7; display: block; }
  .rows { display: grid; gap: 6px; margin: 12px 0; }
  .bar { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; }
  .bar div { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .links a { color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); }
  .log { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  td a { color: var(--ink); margin-right: 10px; }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <h1>Статус сканов</h1>
  <p class="lead">Что прилетает с телефона и что компьютер с этим делает. Обновляется само раз в секунду. Телефон: <code id="phone">/capture.html</code></p>
  <div id="live"></div>
  <div class="card">
    <div class="head"><h2>Собранные</h2><span class="dim">облака и двойники в out/</span></div>
    <table id="done"></table>
  </div>
</div>
<script>
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
$('phone').textContent = `${location.origin.replace('localhost', 'IP-компьютера')}/capture.html`
const ROWS = { mid: ['прямо', 24], low: ['вниз', 12], high: ['вверх', 12] }
const BUILD = { building: 'собираю облако…', done: 'облако готово', error: 'сборка упала' }

function liveCard(s) {
  const ok = s.frames.filter(f => f.state === 'ok').length
  const bad = s.frames.filter(f => f.state === 'bad').length
  const wait = s.frames.length - ok - bad
  const active = !s.build
  const rows = Object.entries(ROWS).map(([k, [name, n]]) => {
    const got = s.frames.filter(f => f.row === k && f.state === 'ok').length
    return `<div class="bar"><span>${name}</span><div><i style="width:${Math.min(100, got / n * 100)}%"></i></div><span class="dim">${got}/${n}</span></div>`
  }).join('')
  const plan = s.build === 'done' ? `out/${s.id}/plan_room.png` : `live/${s.id}/plan.png?v=${s.plan_ver}`
  const frames = s.frames.slice().reverse().map(f => `
    <div class="fr ${f.state}" title="${esc(f.reason || f.tip || '')}">
      <img loading="lazy" src="out/${s.id}/frames/${String(f.i).padStart(3, '0')}.jpg">
      <span class="n">#${f.i} · ${Math.round(f.yaw)}°</span>
      ${f.reason || f.tip ? `<span class="r">${esc(f.reason || f.tip)}</span>` : ''}
    </div>`).join('')
  return `<div class="card live">
    <div class="head">
      <h2>${esc(s.room)}</h2><span class="dim">${esc(s.id)}</span>
      <span class="pill"><span class="dot ${active ? 'on' : ''}"></span>${active ? 'идёт съёмка' : esc(BUILD[s.build] || s.build)}</span>
      <span class="pill" style="color:var(--ok)">принято ${ok}</span>
      <span class="pill" style="color:var(--wait)">считается ${wait}${s.queued ? ` · очередь ${s.queued}` : ''}</span>
      <span class="pill" style="color:var(--bad)">брак ${bad}</span>
      ${s.size ? `<span class="pill">≈ ${s.size[0]} × ${s.size[1]} м</span>` : ''}
    </div>
    <div class="grid">
      <div class="frames">${frames || '<div class="empty">кадров пока нет</div>'}</div>
      <div class="side">
        ${s.plan_ver > 0 || s.build === 'done' ? `<img src="${plan}" alt="план">` : '<div class="empty">план появится после первых кадров</div>'}
        <div class="rows">${rows}</div>
        ${s.build === 'done' ? `<div class="links"><a href="out/${s.id}/cloud.html" target="_blank">3D-облако</a><a href="out/${s.id}/plan_room.png" target="_blank">план</a></div>` : ''}
      </div>
    </div>
  </div>`
}

function doneRow(d) {
  const names = { 'cloud.html': '3D-облако', 'room.html': 'двойник', 'plan_room.png': 'план', 'sheet.jpg': 'кадры' }
  const links = d.files.map(f => `<a href="out/${d.id}/${f}" target="_blank">${names[f]}</a>`).join('')
  return `<tr><td><b>${esc(d.id)}</b><div class="dim">${esc(BUILD[d.build] || d.build || '')}</div></td><td>${links || '<span class="dim">нет результатов</span>'}
    ${d.last?.length ? `<div class="log">${esc(d.last[0])}</div>` : ''}</td></tr>`
}

let lastLive = '', lastDone = ''
async function tick() {
  try {
    const s = await (await fetch('api/sessions', { cache: 'no-store' })).json()
    const live = s.live.length ? s.live.map(liveCard).join('') : '<div class="card"><div class="empty">Живых сканов нет. Открой ссылку на телефоне и нажми «Начать».</div></div>'
    if (live !== lastLive) { $('live').innerHTML = live; lastLive = live }
    const done = s.done.map(doneRow).join('') || '<tr><td class="empty">пока пусто</td></tr>'
    if (done !== lastDone) { $('done').innerHTML = done; lastDone = done }
  } catch {}
  setTimeout(tick, 1000)
}
tick()
</script>
</body>
</html>
